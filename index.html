<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMBER · STUDIO 唯一工作台</title><link rel="canonical" href="https://gemini077.github.io/ember-asset-library/studio/concept/"></head>
<body><p>此地址已停止提供独立工作台。</p><a id="go" href="studio/concept/">进入唯一正式 STUDIO 工作台</a><script>
const target=new URL("studio/concept/",location.href);
const key=location.hash.slice(1),m=key.match(/^(EP\d{2})(?:\/(.*))?$/);
 if(m){target.searchParams.set("episode",m[1]);target.hash=m[2]?.startsWith("asset-card-")?"assets":"production";}
 else if(key.startsWith("scenes/yunyuan"))target.hash=key.replace(/^scenes/,"assets");
 else if(key.startsWith("assets/yunyuan"))target.hash=key;
 else if(key==="people"||key==="scenes"||key==="assets")target.hash="assets";
 else if(["home","script","production","delivery"].includes(key))target.hash=key;
document.getElementById("go").href=target.href;
location.replace(target.href);
</script></body></html>
