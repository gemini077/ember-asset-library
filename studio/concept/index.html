function entry(x,kind){const c=x.current_image||{},first=Object.values(x.current_images||{})[0]||{};return {id:x.id,title:x.title||x.name||x.actor||x.id,kind,status:x.status||x.image_status||"未登记",path:c.path||x.path||x.image_path||first.path||"",source:c.url||x.url||x.image_source_url||first.url||"",prompt:x.prompt||x.master_prompt||"",refs:x.master_reference_uploads||x.reference_uploads||[],raw:x}}
function makeAssets(){const m=new Map(),put=a=>{if(a.id)m.set(a.id,a)},e=ep.embedded_assets||{};for(const [k,l] of [["characters","人物"],["base_reality_looks","妆造"],["wardrobe_looks","妆造"],["cos_looks","COS"],["scenes","场景"]])for(const x of e[k]||[])put(entry(x,l));for(const [k,l] of [["props","道具"],["ui","后期"],["vfx","后期"],["screen_looks","视频"]])for(const x of ep[k]||[])if(!x.canonical_asset_id)put(entry(x,l));for(const id of ep.hero_equipment_refs||[]){const x=index?.hero_equipment?.[id];if(x)put(entry(x,x.type==="技能特效"?"英雄特效":"英雄武器/道具"));}for(const x of Object.values(index.approved||{})){const prior=m.get(x.id);if(x.format_status&&!prior?.raw?.board_migration)continue;if(prior||x.kind==="身份母版")put({...entry(x,prior?.kind||"人物"),status:"已通过",prompt:prior?.prompt||"",refs:prior?.refs||[],raw:prior?.raw||x})}for(const x of e.characters||[]){const a=m.get(x.id);if(a)put(studioIdentityAsset(a,x,index.approved,index.portraits));}for(const x of e.scenes||[]){const a=m.get(x.id);if(!a)continue;const tasks=studioSceneTasks(a,x,hw);Object.assign(a,{path:tasks[0].path,source:tasks[0].source,prompt:tasks[0].prompt,refs:tasks[0].refs,status:tasks[0].status,tasks});for(const v of tasks.slice(1))if(v.path||v.source)put({id:a.id+":"+v.no,parent:a.id,title:a.title+" · "+v.no+" "+v.name,kind:"机位",path:v.path,source:v.source,status:v.status,prompt:v.prompt,refs:v.refs,blocked:v.blocked});}for(const [id,b] of Object.entries(index?.board_migration||{})){const a=m.get(id);if(a&&b.status==="四格待替换"){const raw=(ep.embedded_assets&&Object.values(ep.embedded_assets).flat().find(x=>x.id===id))||a.raw;if(raw?.board_migration)put({...a,identity:false,status:"四格待替换",path:"",source:"",prompt:raw.prompt,refs:raw.reference_uploads,raw});}}if(mapPlan){const maps=studioMapEntries(mapPlan);for(const x of maps)put(x);for(const a of [...m.values()]){const spec=a.raw?.map_execution;if(!spec)continue;const group=maps[0],codes=spec.asset_codes||[];if(!group)continue;const tasks=group.tasks.filter(x=>codes.includes(x.no)),v=tasks[0];Object.assign(a,{mapAlias:true,mapCodes:codes,tasks,path:v?.path||"",source:v?.source||"",prompt:v?.prompt||"",refs:v?.refs||[],status:!tasks.length?"位置待确认":tasks.every(x=>x.approved)?"已通过":tasks.some(x=>!x.blocked)?"待制作":"待前置验收",blocked:!tasks.length||tasks.every(x=>x.blocked)});}}assets=[...m.values()];segments=(state.episode==="EP01"&&window.EMBER_EP01_C051?.source_revision===currentVolume().revision&&window.EMBER_EP01_C051?.segments)||ep.ep01_review?.director_segments||ep.director_segments||[];}

(a.id)+'">'+(a.mapGroup||a.mapAlias?"地图资产制作":a.identity?"查看身份档案":a.kind==="场景"?"九宫格制作":"查看任务")+' ↗</button>':imageBox(a,{button:true}))+'<figcaption><div><strong>'+esc(a.title)+'</strong><small>'+esc(a.kind+" · "+status(a))+'</small>'+((a.mapGroup||a.mapAlias||a.kind==='场景')&&state.assetMode!=='pending'?'<button class="quiet" data-view="'+esc(a.id)+'">'+(a.mapGroup||a.mapAlias?'地图资产制作':'九宫格制作')+' ↗</button>':'')+'</div><span class="status-dot '+(ready(a)?"ready":blocked(a)?"pending":"")+'"></span></figcaption></figure>').join("")||'<div class="empty">未找到匹配资产</div>';$("gallery").querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>openViewer(b.dataset.view))};$("assetQuery").oninput=e=>{state.q=e.target.value;update()};update()}

  const [nextIndex,nextHW,nextThumbs,nextEP,nextMap]=await Promise.all([syncFetch("shared/production-state.json"),syncFetch("shared/hardware-references.json"),syncFetch("studio/thumbnails.json"),syncFetch("data/"+id+".json"),syncFetch("shared/yunyuan-production.json").catch(()=>mapPlan)]);
  if(n!==seq||id!==state.episode||loadingEpisode)return;
  if(syncEqual([index,hw,thumbs,ep,mapPlan],[nextIndex,nextHW,nextThumbs,nextEP,nextMap])){syncPending=false;syncLabel("自动同步");return}
  if(syncEditing()){syncPending=true;syncLabel("更新待应用");return}
  const dialog=$("viewer"),wasOpen=dialog.open,assetId=dialog.dataset.assetId,shot=dialog.dataset.shot||"00",y=window.scrollY;
  const offsets=Object.fromEntries([".asset-workspace",".viewer-media",".viewer-side",".sp-prompt"].map(k=>[k,dialog.querySelector(k)?.scrollTop||0]));
  index=nextIndex;hw=nextHW;thumbs=nextThumbs;mapPlan=nextMap;ep=nextEP;makeAssets();render();
  if(wasOpen){const a=assets.find(x=>x.id===assetId);if(a){if(a.mapGroup||a.mapChild||a.mapAlias)showMapProduction(a,shot);else if(a.tasks?.length)showSceneProduction(a,shot);else openViewer(assetId);for(const [k,v] of Object.entries(offsets)){const el=dialog.querySelector(k);if(el)el.scrollTop=v}}else dialog.close()}
  window.scrollTo(0,y);syncPending=false;syncLabel("已同步 "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"}));
 }catch(e){syncLabel("同步暂不可用 · 自动重试")}finally{syncBusy=false}
}
