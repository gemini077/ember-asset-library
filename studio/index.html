.body{padding:10px}.asset strong{font-size:12px;display:block;overflow-wrap:anywhere}.asset small{display:block;font-size:11px;margin:5px 0}.asset .actions{margin-top:8px;gap:5px}.asset button{font-size:11px;padding:4px 8px}.asset .num{color:var(--accent);font-size:11px;margin-bottom:4px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid var(--line);padding:4px 7px;border-radius:4px;color:var(--muted);font-size:11px}.tag.warn{color:var(--warn)}.line{border:0;border-top:1px solid var(--line);margin:15px 0}.task-status{font-size:12px;min-height:18px;color:var(--muted);margin-top:8px}.metric{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px}.metric div{padding:18px;border:1px solid var(--line);background:var(--panel);border-radius:8px}.metric strong{font-size:28px;display:block}.empty{padding:22px 0;color:var(--muted)}.source{font-size:12px;overflow-wrap:anywhere}.filter{display:flex;gap:10px;margin-bottom:16px}.filter select{width:160px}.segment-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.candidate{padding:12px;border:1px solid var(--line);border-radius:7px;margin-top:8px}.candidate video{width:100%;max-height:360px;background:#111}.candidate.selected{border-color:var(--ok)}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;max-width:94vw;max-height:94vh;padding:20px}dialog::backdrop{background:#000b}dialog img{max-width:85vw;max-height:77vh;display:block;margin-top:12px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.modal-head h2{font-size:16px;margin:0}.notice{background:#25231e;color:var(--warn);padding:10px 12px;border-radius:6px;margin:8px 0;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.stage{position:sticky;top:100px;align-self:start}.scene-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.scene-tabs button.active{border-color:var(--accent);color:var(--accent)}.prompt-view{white-space:pre-wrap;font-size:12px;max-height:420px;overflow:auto;padding:12px;background:#14161a;border-radius:6px;line-height:1.7}.compact{font-size:12px}.mobile-only{display:none}@media(max-width:1050px){.top{gap:10px;padding:0 12px}.nav{gap:10px}.top .right small{display:none}.content{padding:24px}.cols{grid-template-columns:1fr}.stage{position:static}.shell{grid-template-columns:215px minmax(0,1fr)}}@media(max-width:700px){.top{height:auto;flex-wrap:wrap;padding:10px;gap:8px;position:static}.nav{order:3;width:100%;justify-content:space-between;gap:8px}.nav button{padding:8px 0}.top .right{margin-left:0}.top .right button{padding:6px;font-size:11px}.banner{padding:7px 12px}.shell{display:block}.content{padding:18px 12px}.heading{display:block}.heading .actions{margin-top:10px}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}.list{display:flex;overflow:auto}.list button{min-width:150px}.side-heading{margin:8px 0}.metric{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filter{flex-wrap:wrap}.stage{position:static}}
</style></head><body>
<header class="top"><div class="brand"><i>◈</i> STUDIO</div><select id="project" aria-label="项目"></select><nav class="nav" id="nav"></nav><div class="right"><small>交互原型</small><button id="import">导入草稿</button><button id="export">导出草稿</button><input type="file" accept=".json,application/json" id="file" hidden></div></header>
<div class="banner">云端源数据只读 · 草稿在当前页面编辑，刷新前请导出 JSON；尚未接入云端写入或 AI 执行。正式生产继续使用 <a href="../index.html">现有资产库 ↗</a>。</div>
<div class="shell"><aside><div class="side-heading">剧集</div><select id="episode" aria-label="剧集"></select><div class="side-heading"><span id="sideTitle">制作段落</span><button id="newSegment">＋ 新建</button></div><div id="sideList" class="list"></div><p id="sideNote" class="muted compact"></p></aside><main id="main" class="content"><p>读取云端项目数据…</p></main></div>
<dialog id="viewer"><div class="modal-head"><h2 id="viewTitle"></h2><button id="close">关闭</button></div><img id="viewImage" alt=""><p><a id="viewSource" target="_blank" rel="noopener">原始来源 ↗</a></p></dialog>
<dialog id="addDialog"><div class="modal-head"><h2 id="addTitle">添加参考素材</h2><button id="closeAdd">关闭</button></div><div id="addBody"></div></dialog>
<script>
"use strict";
const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const root=new URL("../",location.href);
const url=x=>{if(!x)return "";try{const u=new URL(x,root);return /^https?:$/.test(u.protocol)?u.href:""}catch{return ""}};
const api=async p=>{const r=await fetch(new URL(p,root),{cache:"no-cache"});if(!r.ok)throw Error(p+" "+r.status);return r.json()};
const tabs=[["overview","概览"],["script","剧本"],["assets","资产"],["production","制作"],["delivery","交付"]];
let state={project:"EMBER",episode:"EP01",tab:"production",segment:"01",asset:"",shot:"00",drafts:{},extras:{},result:{},projects:{},query:"",category:"全部"},index,hw,ep,segments=[],assets=[],epoch=0;
const key=()=>state.project+"/"+state.episode;
const draftKey=s=>key()+"/"+s.segment;
const clean=s=>typeof s==="string"?s.replace(/\\n/g,"\n"):String(s??"");
const sceneOf=s=>ep.occurrences.find(x=>x.scene_id===s.scene)||{};
function entry(x,kind){const ci=x.current_image||{},imgs=x.current_images||{},first=Object.values(imgs)[0]||{};return {id:x.id,title:x.title||x.name||x.actor||x.id,kind,status:x.approval||x.status||x.image_status||"状态未登记",path:ci.path||x.image_path||x.path||first.path||"",source:ci.url||x.image_source_url||x.url||x.portrait_source_url||first.url||"",prompt:x.prompt||x.master_prompt||"",refs:x.master_reference_uploads||x.reference_uploads||[],raw:x};}
function buildAssets(){let m=new Map;const put=x=>{if(x.id)m.set(x.id,x)};const emb=ep.embedded_assets||{};for(const [k,label] of [["characters","人物"],["base_reality_looks","妆造"],["wardrobe_looks","妆造"],["cos_looks","妆造"],["scenes","场景"]])for(const x of emb[k]||[])put(entry(x,label));for(const [k,label] of [["props","道具"],["ui","后期"],["vfx","后期"],["screen_looks","视频"]])for(const x of ep[k]||[])put(entry(x,label));if(state.project==="EMBER"){for(const x of Object.values(index.approved||{}))if(m.has(x.id)||x.scope?.includes("EP01")&&state.episode==="EP01")put({...entry(x,"妆造"),status:"已通过",raw:m.get(x.id)?.raw||x});for(const x of Object.values(index.portraits||{}))if(m.has(x.id)&&!m.get(x.id).source)m.get(x.id).source=x.url;
if(m.has(hw.scene_id)){const a=m.get(hw.scene_id);a.status=hw.status;a.path=hw.master.path;a.source=hw.master.url;a.prompt=hw.master_prompt;a.refs=hw.master_reference_uploads;a.raw={...a.raw,...hw};}
}for(const a of [...m.values()]){if(a.kind!=="场景")continue;const images=a.id===hw?.scene_id&&state.project==="EMBER"?Object.values(hw.shots||{}):Object.values(a.raw.current_images||a.raw.shot_images||{});for(const [i,x] of images.entries()){if(!x.path&&!x.url)continue;const name=x.title||x.name||"场景素材 "+(i+1);const no=name.match(/^\d{2}/)?.[0]||String(i).padStart(2,"0");const id=a.id+":"+no;if(m.has(id))continue;put({id,parentId:a.id,title:a.title.replace(/｜空景$/,"")+" · "+name,kind:"场景机位",status:x.status||"状态未登记",path:x.path||"",source:x.url||"",prompt:"",refs:[],raw:x});}}assets=[...m.values()];}
function currentSegment(){return segments.find(s=>s.segment===state.segment)||segments[0];}
function refFromAsset(a){return {id:a.id,title:a.title,path:a.path,source:a.source,status:a.status};}
function isBlocked(a){return a.id===hw?.scene_id&&state.project==="EMBER"&&hw.master_pending||/旧版参考|待新版母图/.test(String(a.status));}
function dependencyState(a){if(isBlocked(a))return "母图依赖未解除";if(!a.path&&!a.source)return "成图或来源未绑定";if(!/已通过|已有成图/.test(statusOf(a)))return "尚待核验";return "";}
function getDraft(s){const k=draftKey(s);if(!state.drafts[k]){state.drafts[k]={shots:clean(s.shots),handoff:clean(s.handoff),seconds:s.seconds??"",platform:"",model:"",aspect:"16:9",prompt:"",refs:[],results:[],chosen:"",refChanged:false};}return state.drafts[k];}
function download(obj,name){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
async function copy(t,el){try{await navigator.clipboard.writeText(t);el.textContent="已复制"}catch{el.textContent="复制失败，请手动选择文本。"}}
function showImage(title,path,src){const u=url(path);if(!u)return;$("viewTitle").textContent=title;$("viewImage").src=u;$("viewSource").href=url(src||path);$("viewer").showModal();}
function statusOf(a){return typeof a.status==="string"?a.status:"状态未登记"}
function assetCard(a,actions="",n=""){const p=url(a.path);return '<article class="asset">'+(p?'<img data-preview="'+esc(p)+'" data-title="'+esc(a.title)+'" data-source="'+esc(url(a.source))+'" src="'+esc(p)+'" loading="lazy" alt="'+esc(a.title)+'">':'<div class="placeholder">无可用缩略图</div>')+'<div class="body">'+(n?'<div class="num">'+esc(n)+'</div>':'')+'<strong>'+esc(a.title)+'</strong><small class="'+(isBlocked(a)?"warn":"")+'">'+esc(statusOf(a))+'</small><div class="actions">'+actions+'</div></div></article>'}
function bindPreview(el=document){el.querySelectorAll("[data-preview]").forEach(i=>i.onclick=()=>showImage(i.dataset.title,i.dataset.preview,i.dataset.source));}
function header(title,sub,actions=""){return '<div class="heading"><div><div class="eyebrow">'+esc(state.project+" / "+state.episode)+'</div><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div><div class="actions">'+actions+'</div></div>';}
function navTo(t){state.tab=t;render();}
function renderSidebar(){const s=currentSegment();$("sideTitle").textContent=state.tab==="script"?"场次":"制作段落";$("newSegment").hidden=state.tab==="script";if(state.tab==="script"){$("sideList").innerHTML=ep.occurrences.map(x=>'<button data-scene="'+esc(x.scene_id)+'"><span>'+esc(x.scene_id)+'</span><div><strong>'+esc(x.location_normalized||x.location_original||x.heading_original)+'</strong><small>'+esc(x.daypart||"")+'</small></div></button>').join("");$("sideList").querySelectorAll("[data-scene]").forEach(b=>b.onclick=()=>{const e=document.getElementById("scene-"+b.dataset.scene);e?.scrollIntoView({behavior:"smooth",block:"start"})});}
else{$("sideList").innerHTML=segments.map(x=>'<button class="'+(x.segment===s?.segment?"active":"")+'" data-segment="'+esc(x.segment)+'"><span>'+esc(x.segment)+'</span><div><strong>'+esc(x.title)+'</strong><small>'+esc(x.scene)+" · "+esc(x.seconds?x.seconds+"秒":"时长待定")+'</small></div></button>').join("")||'<div class="empty">尚未建立制作段落</div>';$("sideList").querySelectorAll("[data-segment]").forEach(b=>b.onclick=()=>{state.segment=b.dataset.segment;state.tab="production";render()});}
$("sideNote").textContent=state.project==="EMBER"&&state.episode!=="EP01"?"本集有正式场次；未把场次自动标为已拆分镜。可创建草稿段落。":"段落源数据保留，修改仅进入草稿。";}
function render(){if(!ep)return;$("nav").innerHTML=tabs.map(([k,t])=>'<button class="'+(k===state.tab?"active":"")+'" data-tab="'+k+'">'+t+'</button>').join("");$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>navTo(b.dataset.tab));renderSidebar();({overview:overview,script:script,assets:assetPage,production:production,delivery:delivery}[state.tab]||production)();}
function overview(){const made=assets.filter(a=>/已通过|已有成图/.test(statusOf(a))&&!isBlocked(a)).length;$("main").innerHTML=header(ep.title,"云端源数据 / 当前集")+'<div class="metric"><div><small>正式场次</small><strong>'+ep.occurrences.length+'</strong></div><div><small>制作段落</small><strong>'+segments.length+'</strong></div><div><small>明确已有成图或通过的资产</small><strong>'+made+'</strong></div></div><div class="panel"><h2>项目源</h2><p>以剧本、资产及制作段落的真实状态为准；未绑定的内容保持空缺。</p><p><a href="'+esc(url(ep.script_url))+'" target="_blank" rel="noopener">打开正式剧本 ↗</a></p><button id="goProduction" class="primary">继续制作</button></div><div class="panel"><h2>通用项目</h2><p>支持导入符合项目草稿格式的其他项目。当前已绑定的真实云端项目为 EMBER；其他项目可通过导入建立本次会话的工作空间。</p><button id="createProject">新建空白项目草稿</button></div>';$("goProduction").onclick=()=>navTo("production");$("createProject").onclick=newProject;}
function script(){$("main").innerHTML=header("剧本","正式剧本只读 · 从场次建立制作段落",'<a href="'+esc(url(ep.script_url))+'" target="_blank" rel="noopener">原始剧本 ↗</a>')+ep.occurrences.map(o=>'<section class="panel" id="scene-'+esc(o.scene_id)+'"><div class="row between"><h2>'+esc(o.heading_original||o.scene_id+" "+o.location_normalized)+'</h2><button data-create="'+esc(o.scene_id)+'">建立段落</button></div><div class="script">'+esc(clean(o.scene_text))+'</div></section>').join("");$("main").querySelectorAll("[data-create]").forEach(b=>b.onclick=()=>newSegment(b.dataset.create));}
function assetPage(){if(state.asset){const a=assets.find(x=>x.id===state.asset);if(a){assetDetail(a);return}}$("main").innerHTML=header("资产","按当前项目与剧集查找实际资产，不重开已通过资产")+'<div class="filter"><input id="assetSearch" value="'+esc(state.query)+'" placeholder="搜索名称、ID"><select id="assetCategory">'+["全部",...new Set(assets.map(a=>a.kind))].map(k=>'<option '+(k===state.category?"selected":"")+'>'+esc(k)+'</option>').join("")+'</select></div><div class="grid" id="assetGrid"></div>';const update=()=>{state.query=$("assetSearch").value;state.category=$("assetCategory").value;const q=state.query.toLowerCase();$("assetGrid").innerHTML=assets.filter(a=>(state.category==="全部"||a.kind===state.category)&&(a.title+" "+a.id).toLowerCase().includes(q)).map(a=>assetCard(a,'<button data-detail="'+esc(a.id)+'">查看详情</button>')).join("")||'<p class="muted">无匹配资产</p>';bindPreview($("assetGrid"));$("assetGrid").querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>{state.asset=b.dataset.detail;state.shot="00";assetPage()})};$("assetSearch").oninput=update;$("assetCategory").onchange=update;update();}
function assetDetail(a){let item=a,views=[],blocked=false;if(a.id===hw?.scene_id&&state.project==="EMBER"){views=[{no:"00",name:"母图",status:hw.master_pending?"待制作":"已完成"},...hw.views];if(state.shot!=="00"){const v=hw.views.find(x=>x.no===state.shot);const img=hw.shots?.[state.shot]||{};item={...a,id:a.id+":"+state.shot,title:v.name,path:img.path,source:img.url,prompt:v.prompt,refs:v.reference_uploads,status:v.status};blocked=!!v.blocked;}}
$("main").innerHTML=header(a.title,statusOf(a),'<button id="backAssets">返回资产</button>')+(views.length?'<div class="scene-tabs">'+views.map(v=>'<button class="'+(v.no===state.shot?"active":"")+'" data-shot="'+esc(v.no)+'">'+esc(v.no+" "+v.name)+'</button>').join("")+'</div>':"")+'<div class="cols"><div class="panel"><h2>当前图像</h2>'+assetCard(item,item.source?'<a href="'+esc(url(item.source))+'" target="_blank" rel="noopener">原始文件 ↗</a>':"")+(blocked?'<p class="notice">等待新版母图确认，不开放本机位生产。</p>':"")+'</div><div class="panel"><h2>制作参考</h2><div class="grid">'+(blocked?"":(item.refs||[]).map((r,i)=>assetCard({id:r.id||"",title:r.name||r.title,path:r.path||r.image_url,source:r.url,status:r.availability||r.purpose||""},r.url?'<a href="'+esc(url(r.url))+'" target="_blank" rel="noopener">来源 ↗</a>':"","图"+(i+1))).join(""))+'</div></div></div>'+(item.prompt&&!blocked?'<div class="panel"><div class="row between"><h2>源提示词</h2><button id="copyAsset">复制</button></div><div class="prompt-view">'+esc(clean(item.prompt))+'</div><p id="assetCopyStatus" class="task-status"></p></div>':"");$("backAssets").onclick=()=>{state.asset="";assetPage()};$("main").querySelectorAll("[data-shot]").forEach(b=>b.onclick=()=>{state.shot=b.dataset.shot;assetDetail(a)});if($("copyAsset"))$("copyAsset").onclick=()=>copy(clean(item.prompt),$("assetCopyStatus"));bindPreview($("main"));}
function production(){const s=currentSegment();if(!s){$("main").innerHTML=header("制作","尚无已登记制作段落")+'<div class="panel"><p>先选择正式场次并建立制作段落草稿，不自动伪造分镜。</p><button class="primary" id="startSegment">新建段落</button></div>';$("startSegment").onclick=()=>newSegment();return;}const d=getDraft(s),o=sceneOf(s),linked=[...new Set(s.asset_links||[])].map(id=>assets.find(a=>a.id===id)||{id,title:id,status:"未在当前集找到资产",kind:"未绑定"});const blockers=linked.filter(a=>dependencyState(a));const linkedVariants=assets.filter(a=>linked.some(x=>x.id===a.parentId));$("main").innerHTML=header(s.segment+"  "+s.title, s.scene+" · "+(d.seconds||"待定")+" 秒 · 制作段落",'<button id="exportTask" class="primary">导出制作任务</button>')+(blockers.length?'<div class="notice">前置资产存在待处理项：'+blockers.map(a=>esc(a.title)).join("、")+'。草稿可编辑，不能标为可直接生成。</div>':"")+'<div class="cols"><div><section class="panel"><div class="row between"><h2>导演设计</h2><button id="restoreDesign">还原源稿</button></div><textarea id="shots" rows="5" placeholder="具体动作、表演、构图、运镜与切换">'+esc(d.shots)+'</textarea><label class="label">前后段落衔接</label><textarea id="handoff" rows="3">'+esc(d.handoff)+'</textarea></section><section class="panel"><div class="row between"><h2>参考素材 · '+d.refs.length+'</h2><button id="addRef">＋ 添加</button></div><p class="muted compact">手动选择本次实际上传的图像、视频或音频。关联资产不会自动等同于生成参考。</p><div id="refs" class="grid"></div><div id="refWarning" class="notice" '+(d.refChanged?"":"hidden")+'>参考顺序或内容已调整，请核对提示词中的图号，再导出。</div></section><section class="panel"><h2>视频提示词</h2><div class="segment-meta"><div><label class="label">平台</label><input id="platform" value="'+esc(d.platform)+'" placeholder="使用的平台"></div><div><label class="label">模型</label><input id="model" value="'+esc(d.model)+'" placeholder="实际模型"></div><div><label class="label">时长 / 秒</label><input type="number" min="1" id="seconds" value="'+esc(d.seconds)+'"></div><div><label class="label">画幅</label><select id="aspect">'+["16:9","9:16","1:1","4:3","3:4","其他"].map(x=>'<option '+(x===d.aspect?"selected":"")+'>'+x+'</option>').join("")+'</select></div></div><label class="label">独立提示词（未填写则不自动编造）</label><textarea id="prompt" rows="8" placeholder="描述完整画面、人物动作、时间安排及实际参考图关系。">'+esc(d.prompt)+'</textarea><div class="toolbar"><button id="copyPrompt">复制提示词</button><button id="checkRefs" '+(!d.refChanged?"disabled":"")+'>已核对参考编号</button></div><p id="copyStatus" class="task-status"></p></section><section class="panel"><div class="row between"><h2>候选结果</h2><button id="addResult">＋ 添加视频链接</button></div><p class="muted compact">外部画布生成后，将已上传云端的视频链接登记至段落。原型不上传文件或调用生成平台。</p><div id="results"></div></section></div><div class="stage"><section class="panel"><h2>对应剧本原文</h2><small>'+esc(o.heading_original||s.scene)+'</small><div class="script">'+esc(clean(o.scene_text||"未绑定原文"))+'</div><hr class="line"><a href="'+esc(url(ep.script_url))+'" target="_blank" rel="noopener">正式剧本 ↗</a></section><section class="panel"><h2>关联资产 · '+(linked.length+linkedVariants.length)+'</h2><div class="grid">'+[...linked,...linkedVariants].map(a=>assetCard(a,'<button data-open-asset="'+esc(a.id)+'">详情</button>'+(a.path||a.source?'<button data-ref-add="'+esc(a.id)+'" '+(isBlocked(a)?"disabled":"")+'>引用</button>':""))).join("")+'</div><p class="muted compact">已有关联不代表已完成；状态按当前共享资产数据。</p></section></div></div>';
for(const k of ["shots","handoff","platform","model","seconds","aspect","prompt"]){$(k).oninput=e=>{d[k]=e.target.value;};}
$("restoreDesign").onclick=()=>{if(confirm("还原导演设计与衔接源稿？")){d.shots=clean(s.shots);d.handoff=clean(s.handoff);production()}};
$("copyPrompt").onclick=()=>{if(!d.prompt.trim()){$("copyStatus").textContent="尚未填写提示词。";return}if(d.refChanged){$("copyStatus").textContent="请先核对参考编号。";return}copy(d.prompt,$("copyStatus"));};
$("checkRefs").onclick=()=>{d.refChanged=false;production()};
$("exportTask").onclick=()=>{if(!d.prompt.trim()){$("copyStatus").textContent="请填写独立视频提示词后导出。";$("prompt").scrollIntoView({block:"center"});return}if(d.refChanged){$("copyStatus").textContent="请先核对参考编号。";return}download({schema:"studio-task-v1",project:state.project,episode:state.episode,segment:s.segment,title:s.title,scene:s.scene,seconds:d.seconds,aspect:d.aspect,platform:d.platform,model:d.model,prompt:d.prompt,references:d.refs.map((r,i)=>({...r,order:i+1,path:url(r.path),source:url(r.source)})),director:d.shots,handoff:d.handoff,script:clean(o.scene_text),unresolved_dependencies:blockers.map(a=>({id:a.id,title:a.title,status:a.status})),draft:true},state.project+"-"+state.episode+"-"+s.segment+"-task.json")};
$("main").querySelectorAll("[data-open-asset]").forEach(b=>b.onclick=()=>{state.asset=b.dataset.openAsset;state.shot="00";navTo("assets")});
$("main").querySelectorAll("[data-ref-add]").forEach(b=>b.onclick=()=>{const a=assets.find(x=>x.id===b.dataset.refAdd);if(a&&!isBlocked(a))addReference(d,refFromAsset(a));});
$("addRef").onclick=()=>openRefPicker(d);$("addResult").onclick=()=>addResult(d);renderRefs(d);renderResults(d);bindPreview($("main"));}
function addReference(d,r){if(d.refs.some(x=>x.id===r.id&&x.path===r.path&&x.source===r.source))return;d.refs.push(r);if(d.prompt.trim())d.refChanged=true;production();}
function renderRefs(d){$("refs").innerHTML=d.refs.map((r,i)=>assetCard(r,'<button data-move="'+i+'" data-dir="-1" '+(!i?"disabled":"")+'>上移</button><button data-move="'+i+'" data-dir="1" '+(i===d.refs.length-1?"disabled":"")+'>下移</button><button data-remove="'+i+'">移除</button>'+(r.source?'<a href="'+esc(url(r.source))+'" target="_blank" rel="noopener">原始文件</a>':""),"参考 "+(i+1))).join("")||'<p class="muted">尚未选择实际生成参考</p>';$("refs").querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{const i=+b.dataset.move,j=i+(+b.dataset.dir);if(j>=0&&j<d.refs.length){[d.refs[i],d.refs[j]]=[d.refs[j],d.refs[i]];d.refChanged=!!d.prompt.trim();production()}});$("refs").querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{d.refs.splice(+b.dataset.remove,1);d.refChanged=!!d.prompt.trim();production()});}
function openRefPicker(d){$("addTitle").textContent="选择实际生成参考";$("addBody").innerHTML='<p class="muted">可选择当前集的有效素材，或登记已上传的外部云端链接。</p><input id="pickerQuery" placeholder="搜索资产"><div id="pickerGrid" class="grid" style="max-height:44vh;overflow:auto;margin:12px 0"></div><hr class="line"><div class="row"><input id="customRefTitle" placeholder="参考名称"><input id="customRefURL" placeholder="https://… 云端文件链接"><select id="customRefKind"><option>图片</option><option>视频</option><option>音频</option><option>其他</option></select><button id="customAdd" class="primary">添加链接</button></div><p id="pickerStatus" class="task-status"></p>';const show=()=>{const q=$("pickerQuery").value.toLowerCase();$("pickerGrid").innerHTML=assets.filter(a=>!isBlocked(a)&&(a.path||a.source)&&(a.title+" "+a.id).toLowerCase().includes(q)).map(a=>assetCard(a,'<button data-pick="'+esc(a.id)+'">添加</button>')).join("");$("pickerGrid").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const a=assets.find(x=>x.id===b.dataset.pick);$("addDialog").close();addReference(d,refFromAsset(a))});};$("pickerQuery").oninput=show;show();$("customAdd").onclick=()=>{const title=$("customRefTitle").value.trim(),source=$("customRefURL").value.trim();if(!title||!/^https?:\/\//i.test(source)||!url(source)){$("pickerStatus").textContent="填写名称及有效的云端 HTTP(S) 链接。";return}$("addDialog").close();addReference(d,{id:"ref-"+crypto.randomUUID(),title,source,status:"外部链接 · 未核验",media:$("customRefKind").value});};$("addDialog").showModal();}
function addResult(d){$("addTitle").textContent="登记视频候选";$("addBody").innerHTML='<label class="label">已上传的云端视频链接</label><input id="resultURL" placeholder="https://…"><label class="label">版本说明 / 返工问题</label><textarea id="resultNote" rows="3"></textarea><button class="primary" id="saveResult">登记候选</button><p id="resultStatus" class="task-status"></p>';$("saveResult").onclick=()=>{const u=$("resultURL").value.trim();if(!/^https?:\/\//i.test(u)||!url(u)){$("resultStatus").textContent="请输入有效 HTTP(S) 视频链接。";return}d.results.push({id:"v-"+crypto.randomUUID(),url:u,note:$("resultNote").value,created:new Date().toISOString()});$("addDialog").close();production()};$("addDialog").showModal();}
function renderResults(d){$("results").innerHTML=d.results.map((v,i)=>'<div class="candidate '+(d.chosen===v.id?"selected":"")+'"><div class="row between"><strong>V'+String(i+1).padStart(2,"0")+'</strong><span class="muted">'+(d.chosen===v.id?"草稿采用":"候选")+'</span></div>'+(/\.(mp4|webm|mov)(\?|$)/i.test(v.url)?'<video controls preload="metadata" src="'+esc(url(v.url))+'"></video>':"")+'<p><a target="_blank" rel="noopener" href="'+esc(url(v.url))+'">打开云端视频 ↗</a></p><p>'+esc(v.note)+'</p><div class="actions"><button data-choose="'+esc(v.id)+'">'+(d.chosen===v.id?"取消采用":"采用此版本")+'</button><button data-delete="'+esc(v.id)+'">移除登记</button></div></div>').join("")||'<p class="muted">尚无候选记录</p>';$("results").querySelectorAll("[data-choose]").forEach(b=>b.onclick=()=>{d.chosen=d.chosen===b.dataset.choose?"":b.dataset.choose;renderResults(d)});$("results").querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{const id=b.dataset.delete;d.results=d.results.filter(v=>v.id!==id);if(d.chosen===id)d.chosen="";renderResults(d)});}
function delivery(){$("main").innerHTML=header("成片交付","按段落查看候选及草稿采用版本，不执行视频拼接")+'<div class="panel">'+(segments.map(s=>{const d=getDraft(s),v=d.results.find(x=>x.id===d.chosen);return '<div class="row between"><div><strong>'+esc(s.segment+" "+s.title)+'</strong><small> · '+esc(d.seconds||"待定")+'秒</small></div>'+(v?'<a href="'+esc(url(v.url))+'" target="_blank" rel="noopener">已选候选 ↗</a>':'<small>尚未选片</small>')+'</div><hr class="line">'}).join("")||'<p>暂无制作段落</p>')+'<button id="exportDelivery">导出交付清单</button></div>';$("exportDelivery").onclick=()=>download({schema:"studio-delivery-v1",project:state.project,episode:state.episode,segments:segments.map(s=>{const d=getDraft(s);return {segment:s.segment,title:s.title,seconds:d.seconds,chosen:d.results.find(x=>x.id===d.chosen)||null}})},state.project+"-"+state.episode+"-delivery.json");}
function newSegment(sceneId){$("addTitle").textContent="新建制作段落草稿";$("addBody").innerHTML='<label class="label">所属正式场次（可留空）</label><select id="newScene"><option value="">未绑定</option>'+ep.occurrences.map(o=>'<option value="'+esc(o.scene_id)+'" '+(o.scene_id===sceneId?"selected":"")+'>'+esc(o.heading_original||o.scene_id)+'</option>').join("")+'</select><label class="label">段落名称</label><input id="newTitle" placeholder="输入名称"><label class="label">时长 / 秒（可留空）</label><input type="number" min="1" id="newSeconds"><button id="saveSegment" class="primary" style="margin-top:12px">创建草稿</button>';$("saveSegment").onclick=()=>{const title=$("newTitle").value.trim();if(!title)return;const s={segment:"D"+String((state.extras[key()]||[]).length+1).padStart(2,"0"),title,scene:$("newScene").value,seconds:$("newSeconds").value,shots:"",handoff:"",asset_links:[]};(state.extras[key()]??=[]).push(s);segments.push(s);state.segment=s.segment;state.tab="production";$("addDialog").close();render()};$("addDialog").showModal();}
function newProject(){$("addTitle").textContent="新建通用项目草稿";$("addBody").innerHTML='<label class="label">项目名称</label><input id="projectName" placeholder="项目名称"><button id="saveProject" class="primary" style="margin-top:12px">创建</button><p id="projectStatus" class="task-status"></p>';$("saveProject").onclick=()=>{const n=$("projectName").value.trim();if(!n||n==="EMBER"||state.projects[n]||["__proto__","constructor","prototype"].includes(n)){$("projectStatus").textContent="请输入未使用的项目名称。";return}state.projects[n]={title:n,episodes:[{id:"MAIN",title:"单部作品"}],data:{MAIN:{title:n,occurrences:[],embedded_assets:{}}}};state.project=n;state.episode="MAIN";$("addDialog").close();populateProjects();populateEpisodes();loadEpisode()};$("addDialog").showModal();}
function populateProjects(){$("project").innerHTML=["EMBER",...Object.keys(state.projects)].map(n=>'<option '+(n===state.project?"selected":"")+'>'+esc(n)+'</option>').join("");}
function populateEpisodes(){const eps=state.project==="EMBER"?index.episodes:state.projects[state.project].episodes;if(!eps.some(x=>x.id===state.episode))state.episode=eps[0].id;$("episode").innerHTML=eps.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===state.episode?"selected":"")+'>'+esc(x.title)+'</option>').join("");}
async function loadEpisode(){const token=++epoch;const p=state.project,e=state.episode;$("main").innerHTML='<p class="muted">读取项目数据…</p>';try{const data=p==="EMBER"?await api("data/"+e+".json"):state.projects[p].data[e];if(token!==epoch)return;ep=data;ep.occurrences??=[];segments=[...(ep.ep01_review?.director_segments||ep.director_segments||[]),...(state.extras[key()]||[])];if(!segments.some(x=>x.segment===state.segment))state.segment=segments[0]?.segment||"";state.asset="";state.category="全部";state.query="";buildAssets();render();}catch(e){if(token===epoch)$("main").innerHTML='<p class="warn">无法加载项目源：'+esc(e.message)+'</p>';}}
$("project").onchange=e=>{state.project=e.target.value;state.episode=state.project==="EMBER"?"EP01":"MAIN";state.segment="01";populateEpisodes();loadEpisode()};$("episode").onchange=e=>{state.episode=e.target.value;state.segment="01";loadEpisode()};$("newSegment").onclick=()=>newSegment();$("close").onclick=()=>$("viewer").close();$("closeAdd").onclick=()=>$("addDialog").close();
$("export").onclick=()=>download({schema:"studio-draft-v1",drafts:state.drafts,extras:state.extras,projects:state.projects},"studio-draft.json");
$("import").onclick=()=>$("file").click();$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.schema!=="studio-draft-v1"||!obj.drafts||!obj.extras||!obj.projects||typeof obj.drafts!=="object"||typeof obj.extras!=="object"||typeof obj.projects!=="object")throw Error("不支持的草稿格式");if(!confirm("导入会替换当前会话草稿，不会修改正式云端数据。继续？"))return;state.drafts=obj.drafts;state.extras=obj.extras;state.projects=obj.projects;if(state.project!=="EMBER"&&!state.projects[state.project])state.project="EMBER";populateProjects();populateEpisodes();loadEpisode()}catch(err){alert("导入失败："+err.message)}finally{e.target.value=""}};
(async()=>{try{[index,hw]=await Promise.all([api("shared/production-state.json"),api("shared/hardware-references.json")]);populateProjects();populateEpisodes();await loadEpisode()}catch(e){$("main").innerHTML='<p class="warn">云端数据读取失败：'+esc(e.message)+'</p>'}})();
</script></body></html>
