<script>
"use strict";
const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const root=new URL("../",location.href);
const url=x=>{if(!x)return "";try{const u=new URL(x,root);return /^https?:$/.test(u.protocol)?u.href:""}catch{return ""}};
const api=async p=>{const r=await fetch(new URL(p,root),{cache:"no-cache"});if(!r.ok)throw Error(p+" "+r.status);return r.json()};
const tabs=[["overview","概览"],["script","剧本"],["assets","资产"],["production","制作"],["delivery","交付"]];
let state={project:"EMBER",episode:"EP01",tab:"production",segment:"01",asset:"",shot:"00",drafts:{},extras:{},result:{},projects:{},query:"",category:"全部"},index,hw,ep,segments=[],assets=[],epoch=0;
const key=()=>state.project+"/"+state.episode;
const draftKey=s=>key()+"/"+s.segment;
const clean=s=>typeof s==="string"?s.replace(/\\n/g,"\n"):String(s??"");
const sceneOf=s=>ep.occurrences.find(x=>x.scene_id===s.scene)||{};
function entry(x,kind){const ci=x.current_image||{},imgs=x.current_images||{},first=Object.values(imgs)[0]||{};return {id:x.id,title:x.title||x.name||x.actor||x.id,kind,status:x.approval||x.status||x.image_status||"状态未登记",path:ci.path||x.image_path||x.path||first.path||"",source:ci.url||x.image_source_url||x.url||x.portrait_source_url||first.url||"",prompt:x.prompt||x.master_prompt||"",refs:x.master_reference_uploads||x.reference_uploads||[],raw:x};}
function buildAssets(){let m=new Map;const put=x=>{if(x.id)m.set(x.id,x)};const emb=ep.embedded_assets||{};for(const [k,label] of [["characters","人物"],["base_reality_looks","妆造"],["wardrobe_looks","妆造"],["cos_looks","妆造"],["scenes","场景"]])for(const x of emb[k]||[])put(entry(x,label));for(const [k,label] of [["props","道具"],["ui","后期"],["vfx","后期"],["screen_looks","视频"]])for(const x of ep[k]||[])put(entry(x,label));if(state.project==="EMBER"){for(const x of Object.values(index.approved||{}))if(m.has(x.id)||x.scope?.includes("EP01")&&state.episode==="EP01")put({...entry(x,"妆造"),status:"已通过",raw:m.get(x.id)?.raw||x});for(const x of Object.values(index.portraits||{}))if(m.has(x.id)&&!m.get(x.id).source)m.get(x.id).source=x.url;
if(m.has(hw.scene_id)){const a=m.get(hw.scene_id);a.status=hw.status;a.path=hw.master.path;a.source=hw.master.url;a.prompt=hw.master_prompt;a.refs=hw.master_reference_uploads;a.raw={...a.raw,...hw};}
}else{for(const x of [...(state.projects[state.project].assets||[]),...(ep.custom_assets||[])])put(entry(x,x.kind||"其他"));}for(const a of [...m.values()]){if(a.kind!=="场景")continue;const images=a.id===hw?.scene_id&&state.project==="EMBER"?Object.values(hw.shots||{}):Object.values(a.raw.current_images||a.raw.shot_images||{});for(const [i,x] of images.entries()){if(!x.path&&!x.url)continue;const name=x.title||x.name||"场景素材 "+(i+1);const no=name.match(/^\d{2}/)?.[0]||String(i).padStart(2,"0");const id=a.id+":"+no;if(m.has(id))continue;put({id,parentId:a.id,title:a.title.replace(/｜空景$/,"")+" · "+name,kind:"场景机位",status:x.status||"状态未登记",path:x.path||"",source:x.url||"",prompt:"",refs:[],raw:x});}}assets=[...m.values()];}
function currentSegment(){return segments.find(s=>s.segment===state.segment)||segments[0];}
function refFromAsset(a){return {id:a.id,title:a.title,path:a.path,source:a.source,status:a.status};}
function isBlocked(a){return a.id===hw?.scene_id&&state.project==="EMBER"&&hw.master_pending||/旧版参考|待新版母图/.test(String(a.status));}
function dependencyState(a){if(isBlocked(a))return "母图依赖未解除";if(!a.path&&!a.source)return "成图或来源未绑定";if(!/已通过|已有成图/.test(statusOf(a)))return "尚待核验";return "";}
function getDraft(s){const k=draftKey(s);if(!state.drafts[k]){state.drafts[k]={shots:clean(s.shots),handoff:clean(s.handoff),seconds:s.seconds??"",platform:"",model:"",aspect:"16:9",prompt:"",refs:[],results:[],chosen:"",refChanged:false};}return state.drafts[k];}
function download(obj,name){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
async function copy(t,el){try{await navigator.clipboard.writeText(t);el.textContent="已复制"}catch{el.textContent="复制失败，请手动选择文本。"}}
function showImage(title,path,src){const u=url(path);if(!u)return;$("viewTitle").textContent=title;$("viewImage").src=u;$("viewSource").href=url(src||path);$("viewer").showModal();}
function statusOf(a){return typeof a.status==="string"?a.status:"状态未登记"}
function assetCard(a,actions="",n=""){const p=url(a.path);return '<article class="asset">'+(p?'<img data-preview="'+esc(p)+'" data-title="'+esc(a.title)+'" data-source="'+esc(url(a.source))+'" src="'+esc(p)+'" loading="lazy" alt="'+esc(a.title)+'">':'<div class="placeholder">无可用缩略图</div>')+'<div class="body">'+(n?'<div class="num">'+esc(n)+'</div>':'')+'<strong>'+esc(a.title)+'</strong><small class="'+(isBlocked(a)?"warn":"")+'">'+esc(statusOf(a))+'</small><div class="actions">'+actions+'</div></div></article>'}
function bindPreview(el=document){el.querySelectorAll("[data-preview]").forEach(i=>i.onclick=()=>showImage(i.dataset.title,i.dataset.preview,i.dataset.source));}
function header(title,sub,actions=""){return '<div class="heading"><div><div class="eyebrow">'+esc(state.project+" / "+state.episode)+'</div><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div><div class="actions">'+actions+'</div></div>';}
function navTo(t){state.tab=t;render();}
function renderSidebar(){const s=currentSegment();$("sideTitle").textContent=state.tab==="script"?"场次":"制作段落";$("newSegment").hidden=state.tab==="script";if(state.tab==="script"){$("sideList").innerHTML=ep.occurrences.map(x=>'<button data-scene="'+esc(x.scene_id)+'"><span>'+esc(x.scene_id)+'</span><div><strong>'+esc(x.location_normalized||x.location_original||x.heading_original)+'</strong><small>'+esc(x.daypart||"")+'</small></div></button>').join("");$("sideList").querySelectorAll("[data-scene]").forEach(b=>b.onclick=()=>{const e=document.getElementById("scene-"+b.dataset.scene);e?.scrollIntoView({behavior:"smooth",block:"start"})});}
else{$("sideList").innerHTML=segments.map(x=>'<button class="'+(x.segment===s?.segment?"active":"")+'" data-segment="'+esc(x.segment)+'"><span>'+esc(x.segment)+'</span><div><strong>'+esc(x.title)+'</strong><small>'+esc(x.scene)+" · "+esc(x.seconds?x.seconds+"秒":"时长待定")+'</small></div></button>').join("")||'<div class="empty">尚未建立制作段落</div>';$("sideList").querySelectorAll("[data-segment]").forEach(b=>b.onclick=()=>{state.segment=b.dataset.segment;state.tab="production";render()});}
$("sideNote").textContent=state.project==="EMBER"&&state.episode!=="EP01"?"本集有正式场次；未把场次自动标为已拆分镜。可创建草稿段落。":"段落源数据保留，修改仅进入草稿。";}
function render(){if(!ep)return;$("nav").innerHTML=tabs.map(([k,t])=>'<button class="'+(k===state.tab?"active":"")+'" data-tab="'+k+'">'+t+'</button>').join("");$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>navTo(b.dataset.tab));renderSidebar();({overview:overview,script:script,assets:assetPage,production:production,delivery:delivery}[state.tab]||production)();}
function overview(){if(state.project!=="EMBER"){projectOverview();return;}const made=assets.filter(a=>/已通过|已有成图/.test(statusOf(a))&&!isBlocked(a)).length;$("main").innerHTML=header(ep.title,"云端源数据 / 当前集")+'<div class="metric"><div><small>正式场次</small><strong>'+ep.occurrences.length+'</strong></div><div><small>制作段落</small><strong>'+segments.length+'</strong></div><div><small>明确已有成图或通过的资产</small><strong>'+made+'</strong></div></div><div class="panel"><h2>项目源</h2><p>以剧本、资产及制作段落的真实状态为准；未绑定的内容保持空缺。</p><p><a href="'+esc(url(ep.script_url))+'" target="_blank" rel="noopener">打开正式剧本 ↗</a></p><button id="goProduction" class="primary">继续制作</button></div><div class="panel"><h2>通用项目</h2><p>支持导入符合项目草稿格式的其他项目。当前已绑定的真实云端项目为 EMBER；其他项目可通过导入建立本次会话的工作空间。</p><button id="createProject">新建空白项目草稿</button></div>';$("goProduction").onclick=()=>navTo("production");$("createProject").onclick=newProject;}
function script(){if(state.project!=="EMBER"){projectScript();return;}$("main").innerHTML=header("剧本","正式剧本只读 · 从场次建立制作段落",'<a href="'+esc(url(ep.script_url))+'" target="_blank" rel="noopener">原始剧本 ↗</a>')+ep.occurrences.map(o=>'<section class="panel" id="scene-'+esc(o.scene_id)+'"><div class="row between"><h2>'+esc(o.heading_original||o.scene_id+" "+o.location_normalized)+'</h2><button data-create="'+esc(o.scene_id)+'">建立段落</button></div><div class="script">'+esc(clean(o.scene_text))+'</div></section>').join("");$("main").querySelectorAll("[data-create]").forEach(b=>b.onclick=()=>newSegment(b.dataset.create));}

const aiFields={shots:"导演设计",handoff:"衔接要求",prompt:"视频提示词",seconds:"时长（秒）"};
async function digest(obj){const b=new TextEncoder().encode(JSON.stringify(obj));const hash=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,"0")).join("");}

 const source=sceneOf(s),ref=r=>({id:r.id,title:r.title,path:url(r.path),source:url(r.source),status:statusOf(r),media:r.media||"图片/按原始素材"});
 return {project:state.project,...(state.project==="EMBER"?{}:{project_notes:state.projects[state.project]?.notes||""}),episode:state.episode,segment:s.segment,title:s.title,source:{scene_id:s.scene,heading:source.heading_original||"",script:clean(source.scene_text||""),script_url:url(ep.script_url),director_original:clean(s.shots),handoff_original:clean(s.handoff),seconds_original:s.seconds??""},draft:{shots:d.shots,handoff:d.handoff,prompt:d.prompt,seconds:d.seconds,aspect:d.aspect,platform:d.platform,model:d.model,refChanged:d.refChanged},references:d.refs.map((r,i)=>({...ref(r),order:i+1})),linked_assets:linked.map(a=>({...ref(a),dependency:dependencyState(a)})),scene_variants:assets.filter(a=>linked.some(x=>x.id===a.parentId)).map(a=>({...ref(a),dependency:dependencyState(a)})),candidate_results:d.results.map(x=>({id:x.id,url:url(x.url),note:x.note})),chosen_result:d.chosen||null};
}
async function packet(s,d,linked,task){
 const context=aiContext(s,d,linked),base=await digest(context);
 return {schema:"studio-ai-task-v1",base,context,task,write_contract:{schema:"studio-ai-patch-v1",base,project:context.project,episode:context.episode,segment:context.segment,changes:{},allowed_fields:Object.keys(aiFields),notes:"只输出建议修改字段；不要改动正式源文件、资产验收状态、引用顺序或候选视频。未确认的素材不当作已通过。若缺少信息则在notes注明。提示词必须独立成立，依据references的实际顺序；linked_assets及scene_variants仅为候选/依赖，不自动等于上传参考。输出changes可为空。返回JSON供用户预览确认。"}};
}

 }catch(e){status.textContent="未应用："+e.message}};

function openRefPicker(d){$("addTitle").textContent="选择实际生成参考";$("addBody").innerHTML='<p class="muted">可选择当前集的有效素材，或登记已上传的外部云端链接。</p><input id="pickerQuery" placeholder="搜索资产"><div id="pickerGrid" class="grid" style="max-height:44vh;overflow:auto;margin:12px 0"></div><hr class="line"><div class="row"><input id="customRefTitle" placeholder="参考名称"><input id="customRefURL" placeholder="https://… 云端文件链接"><select id="customRefKind"><option>图片</option><option>视频</option><option>音频</option><option>其他</option></select><button id="customAdd" class="primary">添加链接</button></div><p id="pickerStatus" class="task-status"></p>';const show=()=>{const q=$("pickerQuery").value.toLowerCase();$("pickerGrid").innerHTML=assets.filter(a=>!isBlocked(a)&&(a.path||a.source)&&(a.title+" "+a.id).toLowerCase().includes(q)).map(a=>assetCard(a,'<button data-pick="'+esc(a.id)+'">添加</button>')).join("");$("pickerGrid").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const a=assets.find(x=>x.id===b.dataset.pick);$("addDialog").close();addReference(d,refFromAsset(a))});};$("pickerQuery").oninput=show;show();$("customAdd").onclick=()=>{const title=$("customRefTitle").value.trim(),source=$("customRefURL").value.trim();if(!title||!/^https?:\/\//i.test(source)||!url(source)){$("pickerStatus").textContent="填写名称及有效的云端 HTTP(S) 链接。";return}$("addDialog").close();addReference(d,{id:"ref-"+crypto.randomUUID(),title,source,status:"外部链接 · 未核验",media:$("customRefKind").value});};$("addDialog").showModal();}
function addResult(d){$("addTitle").textContent="登记视频候选";$("addBody").innerHTML='<label class="label">已上传的云端视频链接</label><input id="resultURL" placeholder="https://…"><label class="label">版本说明 / 返工问题</label><textarea id="resultNote" rows="3"></textarea><button class="primary" id="saveResult">登记候选</button><p id="resultStatus" class="task-status"></p>';$("saveResult").onclick=()=>{const u=$("resultURL").value.trim();if(!/^https?:\/\//i.test(u)||!url(u)){$("resultStatus").textContent="请输入有效 HTTP(S) 视频链接。";return}d.results.push({id:"v-"+crypto.randomUUID(),url:u,note:$("resultNote").value,created:new Date().toISOString()});$("addDialog").close();production()};$("addDialog").showModal();}
function renderResults(d){$("results").innerHTML=d.results.map((v,i)=>'<div class="candidate '+(d.chosen===v.id?"selected":"")+'"><div class="row between"><strong>V'+String(i+1).padStart(2,"0")+'</strong><span class="muted">'+(d.chosen===v.id?"草稿采用":"候选")+'</span></div>'+(/\.(mp4|webm|mov)(\?|$)/i.test(v.url)?'<video controls preload="metadata" src="'+esc(url(v.url))+'"></video>':"")+'<p><a target="_blank" rel="noopener" href="'+esc(url(v.url))+'">打开云端视频 ↗</a></p><p>'+esc(v.note)+'</p><div class="actions"><button data-choose="'+esc(v.id)+'">'+(d.chosen===v.id?"取消采用":"采用此版本")+'</button><button data-delete="'+esc(v.id)+'">移除登记</button></div></div>').join("")||'<p class="muted">尚无候选记录</p>';$("results").querySelectorAll("[data-choose]").forEach(b=>b.onclick=()=>{d.chosen=d.chosen===b.dataset.choose?"":b.dataset.choose;renderResults(d)});$("results").querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{const id=b.dataset.delete;d.results=d.results.filter(v=>v.id!==id);if(d.chosen===id)d.chosen="";renderResults(d)});}
function delivery(){$("main").innerHTML=header("成片交付","按段落查看候选及草稿采用版本，不执行视频拼接")+'<div class="panel">'+(segments.map(s=>{const d=getDraft(s),v=d.results.find(x=>x.id===d.chosen);return '<div class="row between"><div><strong>'+esc(s.segment+" "+s.title)+'</strong><small> · '+esc(d.seconds||"待定")+'秒</small></div>'+(v?'<a href="'+esc(url(v.url))+'" target="_blank" rel="noopener">已选候选 ↗</a>':'<small>尚未选片</small>')+'</div><hr class="line">'}).join("")||'<p>暂无制作段落</p>')+'<button id="exportDelivery">导出交付清单</button></div>';$("exportDelivery").onclick=()=>download({schema:"studio-delivery-v1",project:state.project,episode:state.episode,segments:segments.map(s=>{const d=getDraft(s);return {segment:s.segment,title:s.title,seconds:d.seconds,chosen:d.results.find(x=>x.id===d.chosen)||null}})},state.project+"-"+state.episode+"-delivery.json");}
function newSegment(sceneId){$("addTitle").textContent="新建制作段落草稿";$("addBody").innerHTML='<label class="label">所属正式场次（可留空）</label><select id="newScene"><option value="">未绑定</option>'+ep.occurrences.map(o=>'<option value="'+esc(o.scene_id)+'" '+(o.scene_id===sceneId?"selected":"")+'>'+esc(o.heading_original||o.scene_id)+'</option>').join("")+'</select><label class="label">段落名称</label><input id="newTitle" placeholder="输入名称"><label class="label">时长 / 秒（可留空）</label><input type="number" min="1" id="newSeconds"><button id="saveSegment" class="primary" style="margin-top:12px">创建草稿</button>';$("saveSegment").onclick=()=>{const title=$("newTitle").value.trim();if(!title)return;const s={segment:"D"+String((state.extras[key()]||[]).length+1).padStart(2,"0"),title,scene:$("newScene").value,seconds:$("newSeconds").value,shots:"",handoff:"",asset_links:[]};(state.extras[key()]??=[]).push(s);segments.push(s);state.segment=s.segment;state.tab="production";$("addDialog").close();render()};$("addDialog").showModal();}

function projectDialog(title,body,save){
 $("addTitle").textContent=title;$("addBody").innerHTML=body+'<button class="primary" id="projectSave">保存草稿</button><p class="task-status" id="projectError"></p>';
 $("projectSave").onclick=()=>{try{save();$("addDialog").close();render()}catch(e){$("projectError").textContent=e.message}};$("addDialog").showModal();
}
function fld(id,label,value="",area=false){return '<label class="label" for="'+id+'">'+esc(label)+'</label>'+(area?'<textarea id="'+id+'" rows="7">'+esc(value)+'</textarea>':'<input id="'+id+'" value="'+esc(value)+'">')}
function val(id){return $(id).value.trim()}
function requireText(v){if(!v)throw Error("请填写必填内容");return v}
function checkURL(v){if(v&&!/^https?:\/\//i.test(v))throw Error("请输入 HTTP(S) 云端链接");return v}
function projectOverview(){
 const p=state.projects[state.project];
 $("main").innerHTML=header(p.title,"项目草稿 / "+ep.title,'<button class="primary" id="newWorkEpisode">＋ 新建剧集</button>')+
 '<div class="metric"><div><small>作品 / 剧集</small><strong>'+p.episodes.length+'</strong></div><div><small>场次</small><strong>'+ep.occurrences.length+'</strong></div><div><small>共用资产</small><strong>'+assets.length+'</strong></div></div>'+
 '<div class="panel"><h2>项目设定与制作规范</h2>'+fld("projectNotes","项目说明",p.notes||"",true)+'<p class="muted">仅保存至当前会话草稿，导出 JSON 可完整保留；尚未接入云端自动保存。</p></div><div class="panel"><h2>作品信息</h2>'+fld("workTitle","名称",ep.title)+fld("workScript","正式剧本云端链接",ep.script_url||"")+'<button id="saveWorkMeta">保存作品信息</button><p id="workStatus" class="task-status"></p></div>';
 $("projectNotes").oninput=e=>p.notes=e.target.value;
 $("saveWorkMeta").onclick=()=>{try{ep.title=requireText(val("workTitle"));ep.script_url=checkURL(val("workScript"));p.episodes.find(x=>x.id===state.episode).title=ep.title;populateEpisodes();$("workStatus").textContent="已保存至当前草稿"}catch(e){$("workStatus").textContent=e.message}};
 $("newWorkEpisode").onclick=()=>projectDialog("新建剧集",fld("workEpisodeName","剧集名称"),()=>{const title=requireText(val("workEpisodeName")),id="EP-"+crypto.randomUUID();p.episodes.push({id,title});p.data[id]={title,occurrences:[],embedded_assets:{}};state.episode=id;state.segment="";populateEpisodes();ep=p.data[id];segments=[];state.asset="";buildAssets()});
}
function projectScript(){
 $("main").innerHTML=header("剧本","项目草稿 · 按场次维护真实文本",'<button class="primary" id="addProjectScene">＋ 新建场次</button>')+
 (ep.occurrences.map(o=>'<section class="panel" id="scene-'+esc(o.scene_id)+'"><div class="row between"><h2>'+esc(o.heading_original)+'</h2><div class="actions"><button data-project-scene="'+esc(o.scene_id)+'">编辑</button><button data-create="'+esc(o.scene_id)+'">建立段落</button></div></div><div class="script">'+esc(clean(o.scene_text))+'</div></section>').join("")||'<div class="panel"><p class="muted">尚无场次。可粘贴剧本文本，不自动编造剧情。</p></div>');
 $("addProjectScene").onclick=()=>projectScene();$("main").querySelectorAll("[data-project-scene]").forEach(b=>b.onclick=()=>projectScene(b.dataset.projectScene));$("main").querySelectorAll("[data-create]").forEach(b=>b.onclick=()=>newSegment(b.dataset.create));
}
function projectScene(id){
 if(state.project==="EMBER")return;const o=ep.occurrences.find(x=>x.scene_id===id);
 projectDialog(o?"编辑场次":"新建场次",fld("projectHeading","场次标题",o?.heading_original||"")+fld("projectText","剧本正文",o?.scene_text||"",true),()=>{const title=requireText(val("projectHeading")),body=requireText(val("projectText")),x={heading_original:title,location_normalized:title,scene_text:body};if(o)Object.assign(o,x);else ep.occurrences.push({scene_id:"SC-"+crypto.randomUUID(),...x})});
}
function projectAsset(id){
 if(state.project==="EMBER")return;const p=state.projects[state.project],a=[...(p.assets||[]),...(ep.custom_assets||[])].find(x=>x.id===id);
 projectDialog(a?"编辑资产":"登记共用资产",fld("paTitle","名称",a?.title||"")+fld("paKind","自定义分类",a?.kind||"人物")+fld("paSource","原始云端链接（可选）",a?.url||"")+fld("paImage","直接图片 URL（可选）",a?.image_path||"")+'<label class="label">状态</label><select id="paStatus">'+["待制作","已有成图","待验收","已通过"].map(x=>'<option '+(x===a?.status?"selected":"")+'>'+x+'</option>').join("")+'</select>'+fld("paPrompt","独立提示词",a?.prompt||"",true),()=>{const title=requireText(val("paTitle")),kind=requireText(val("paKind")),url=checkURL(val("paSource")),image_path=checkURL(val("paImage")),status=val("paStatus");if(status!=="待制作"&&!url&&!image_path)throw Error("已有或通过素材须绑定真实文件链接");const x={id:a?.id||"AS-"+crypto.randomUUID(),title,kind,url,image_path,status,prompt:$("paPrompt").value};if(a)Object.assign(a,x);else(p.assets??=[]).push(x);state.asset="";state.query="";state.category="全部";buildAssets()});
}
function projectLinks(s){
 if(state.project==="EMBER")return;const ids=new Set(s.asset_links||[]);
 projectDialog("关联制作依赖",'<p class="muted">关联资产不等同于实际上传参考。</p><div style="max-height:55vh;overflow:auto">'+(assets.map(a=>'<label class="row"><input type="checkbox" style="width:auto" data-pl="'+esc(a.id)+'" '+(ids.has(a.id)?"checked":"")+'><span>'+esc(a.title)+' · '+esc(a.status)+'</span></label>').join("")||'<p>先登记素材。</p>')+'</div>',()=>{s.asset_links=[...$("addBody").querySelectorAll("[data-pl]:checked")].map(x=>x.dataset.pl)});
}

function newProject(){$("addTitle").textContent="新建通用项目草稿";$("addBody").innerHTML='<label class="label">项目名称</label><input id="projectName" placeholder="项目名称"><button id="saveProject" class="primary" style="margin-top:12px">创建</button><p id="projectStatus" class="task-status"></p>';$("saveProject").onclick=()=>{const n=$("projectName").value.trim();if(!n||n.includes("/")||n==="EMBER"||state.projects[n]||["__proto__","constructor","prototype"].includes(n)){$("projectStatus").textContent="请输入未使用的项目名称。";return}state.projects[n]={title:n,episodes:[{id:"MAIN",title:"单部作品"}],data:{MAIN:{title:n,occurrences:[],embedded_assets:{}}}};state.project=n;state.episode="MAIN";$("addDialog").close();populateProjects();populateEpisodes();loadEpisode()};$("addDialog").showModal();}
function populateProjects(){$("project").innerHTML=["EMBER",...Object.keys(state.projects)].map(n=>'<option '+(n===state.project?"selected":"")+'>'+esc(n)+'</option>').join("");}
function populateEpisodes(){const eps=state.project==="EMBER"?index.episodes:state.projects[state.project].episodes;if(!eps.some(x=>x.id===state.episode))state.episode=eps[0].id;$("episode").innerHTML=eps.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===state.episode?"selected":"")+'>'+esc(x.title)+'</option>').join("");}
async function loadEpisode(){const token=++epoch;const p=state.project,e=state.episode;$("main").innerHTML='<p class="muted">读取项目数据…</p>';try{const data=p==="EMBER"?await api("data/"+e+".json"):state.projects[p].data[e];if(token!==epoch)return;ep=data;ep.occurrences??=[];segments=[...(ep.ep01_review?.director_segments||ep.director_segments||[]),...(state.extras[key()]||[])];if(!segments.some(x=>x.segment===state.segment))state.segment=segments[0]?.segment||"";state.asset="";state.category="全部";state.query="";buildAssets();render();}catch(e){if(token===epoch)$("main").innerHTML='<p class="warn">无法加载项目源：'+esc(e.message)+'</p>';}}
$("project").onchange=e=>{state.project=e.target.value;state.episode=state.project==="EMBER"?"EP01":"MAIN";state.segment="01";populateEpisodes();loadEpisode()};$("episode").onchange=e=>{state.episode=e.target.value;state.segment="01";loadEpisode()};$("newSegment").onclick=()=>newSegment();$("close").onclick=()=>$("viewer").close();$("closeAdd").onclick=()=>$("addDialog").close();
$("export").onclick=()=>download({schema:"studio-draft-v1",drafts:state.drafts,extras:state.extras,projects:state.projects},"studio-draft.json");
$("import").onclick=()=>$("file").click();$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.schema!=="studio-draft-v1"||!obj.drafts||!obj.extras||!obj.projects||typeof obj.drafts!=="object"||typeof obj.extras!=="object"||typeof obj.projects!=="object")throw Error("不支持的草稿格式");if(!confirm("导入会替换当前会话草稿，不会修改正式云端数据。继续？"))return;state.drafts=obj.drafts;state.extras=obj.extras;state.projects=obj.projects;if(state.project!=="EMBER"&&!state.projects[state.project])state.project="EMBER";populateProjects();populateEpisodes();loadEpisode()}catch(err){alert("导入失败："+err.message)}finally{e.target.value=""}};
(async()=>{try{[index,hw]=await Promise.all([api("shared/production-state.json"),api("shared/hardware-references.json")]);populateProjects();populateEpisodes();await loadEpisode()}catch(e){$("main").innerHTML='<p class="warn">云端数据读取失败：'+esc(e.message)+'</p>'}})();
</script></body></html>
